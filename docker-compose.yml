version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: lostfound-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: lostfound
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: lostfound-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:dev@db:5432/lostfound
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - image_store:/app/image_store

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: lostfound-ui
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
  image_store:

